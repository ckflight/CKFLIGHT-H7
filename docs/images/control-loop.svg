<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 860" width="1600" height="860" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07101f"/>
      <stop offset="1" stop-color="#0c1a33"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#3b82f6"/>
    </linearGradient>
    <style>
      .t { fill:#e6f1ff; } .s { fill:#9fb3cc; } .c { fill:#22d3ee; } .o { fill:#f97316; } .g { fill:#34d399; }
      .box { fill:#0f2140; stroke:#1f3d66; stroke-width:2; }
      .mono { font-family: Consolas, Menlo, monospace; }
    </style>
  </defs>

  <rect width="1600" height="860" fill="url(#bg)"/>
  <rect x="0" y="0" width="1600" height="6" fill="url(#bar)"/>

  <text x="60" y="78" class="c" font-size="18" font-weight="600" letter-spacing="3">CKFLIGHT · CONTROL LOOP</text>
  <text x="60" y="122" class="t" font-size="38" font-weight="700">One deterministic loop, sensor to motor</text>
  <text x="60" y="158" class="s" font-size="19">Bare-metal on F4 / H7, highest-priority ThreadX thread on N6. Same App/ code on every board and in the simulator.</text>

  <!-- pipeline -->
  <text x="60" y="222" class="c" font-size="15" font-weight="600" letter-spacing="2">ONE ITERATION · IN ORDER (App/main.c → CKFLIGHT_Loop)</text>
  <g font-size="15" text-anchor="middle">
    <rect x="60"   y="240" width="120" height="86" rx="10" class="box"/><text x="120"  y="278" class="t" font-weight="600">USB · RX</text><text x="120" y="302" class="s" font-size="13">CRSF / SBUS</text>
    <rect x="190"  y="240" width="120" height="86" rx="10" class="box"/><text x="250"  y="278" class="t" font-weight="600">Gyro</text><text x="250" y="302" class="s" font-size="13">filters, notch</text>
    <rect x="320"  y="240" width="120" height="86" rx="10" class="box"/><text x="380"  y="278" class="t" font-weight="600">Acc · Mag</text><text x="380" y="302" class="s" font-size="13">Baro · GPS</text>
    <rect x="450"  y="240" width="120" height="86" rx="10" class="box"/><text x="510"  y="278" class="t" font-weight="600">IMU</text><text x="510" y="302" class="s" font-size="13">Mahony, 500 Hz</text>
    <rect x="580"  y="240" width="120" height="86" rx="10" class="box"/><text x="640"  y="278" class="t" font-weight="600">Navigation</text><text x="640" y="302" class="s" font-size="13">estimator</text>
    <rect x="710"  y="240" width="120" height="86" rx="10" class="box"/><text x="770"  y="278" class="t" font-weight="600">Setpoint</text><text x="770" y="302" class="s" font-size="13">rates, FF</text>
    <rect x="840"  y="240" width="120" height="86" rx="10" class="box"/><text x="900"  y="278" class="t" font-weight="600">PID</text><text x="900" y="302" class="s" font-size="13">TPA, D-max, AG</text>
    <rect x="970"  y="240" width="170" height="86" rx="10" fill="#0f2140" stroke="#22d3ee" stroke-width="2.5"/><text x="1055" y="278" class="c" font-weight="700">Mixer → DShot</text><text x="1055" y="302" class="c" font-size="13">4 frames, same loop</text>
    <rect x="1150" y="240" width="120" height="86" rx="10" class="box"/><text x="1210" y="278" class="t" font-weight="600">OSD</text><text x="1210" y="302" class="s" font-size="13">200 Hz</text>
    <rect x="1280" y="240" width="120" height="86" rx="10" class="box"/><text x="1340" y="278" class="t" font-weight="600">Blackbox</text><text x="1340" y="302" class="s" font-size="13">SD via DMA</text>
    <rect x="1410" y="240" width="130" height="86" rx="10" class="box"/><text x="1475" y="278" class="t" font-weight="600">Monitor</text><text x="1475" y="302" class="s" font-size="13">battery, health</text>
  </g>
  <g stroke="#22d3ee" stroke-width="2">
    <line x1="180" y1="283" x2="190" y2="283"/><line x1="310" y1="283" x2="320" y2="283"/><line x1="440" y1="283" x2="450" y2="283"/>
    <line x1="570" y1="283" x2="580" y2="283"/><line x1="700" y1="283" x2="710" y2="283"/><line x1="830" y1="283" x2="840" y2="283"/>
    <line x1="960" y1="283" x2="970" y2="283"/><line x1="1140" y1="283" x2="1150" y2="283"/><line x1="1270" y1="283" x2="1280" y2="283"/>
    <line x1="1400" y1="283" x2="1410" y2="283"/>
  </g>
  <path d="M1475 326 L1475 356 L120 356 L120 330" fill="none" stroke="#1f3d66" stroke-width="2" stroke-dasharray="6 6"/>
  <text x="800" y="380" class="s" font-size="14" text-anchor="middle">wait for the next period (F4 / H7: busy-wait · N6: TIM5 semaphore, idle CPU goes to USB, SD, AI, LCD)</text>

  <!-- rates table -->
  <text x="60" y="446" class="c" font-size="15" font-weight="600" letter-spacing="2">LOOP RATES</text>
  <rect x="60" y="462" width="700" height="250" rx="14" class="box"/>
  <g font-size="16">
    <text x="90"  y="500" class="s" font-weight="600">Board</text>
    <text x="330" y="500" class="s" font-weight="600">Gyro · PID · DShot</text>
    <text x="560" y="500" class="s" font-weight="600">Blackbox (default)</text>
    <line x1="80" y1="514" x2="740" y2="514" stroke="#1f3d66" stroke-width="2"/>
    <text x="90"  y="552" class="t" font-weight="600">STM32H7</text><text x="330" y="552" class="c" font-weight="700">8 kHz</text><text x="560" y="552" class="t">4 kHz (1/2)</text>
    <text x="90"  y="594" class="t" font-weight="600">STM32N6</text><text x="330" y="594" class="c" font-weight="700">8 kHz</text><text x="560" y="594" class="t">4 kHz (1/2)</text>
    <text x="90"  y="636" class="t" font-weight="600">STM32F4</text><text x="330" y="636" class="c" font-weight="700">4 kHz</text><text x="560" y="636" class="t">2 kHz (1/2)</text>
    <text x="90"  y="684" class="s" font-size="14">ACC = loop rate on H7 / N6, 1 kHz on F4 · IMU 500 Hz · OSD 200 Hz · DShot600</text>
  </g>

  <!-- priority table -->
  <text x="800" y="446" class="c" font-size="15" font-weight="600" letter-spacing="2">INTERRUPT PRIORITIES (F4 / H7)</text>
  <rect x="800" y="462" width="740" height="250" rx="14" class="box"/>
  <g font-size="15">
    <text x="830" y="500" class="c mono" font-weight="700">0</text><text x="870" y="500" class="t">CRSF / SBUS UART · DShot output guard (TIM7)</text>
    <text x="830" y="532" class="c mono" font-weight="700">1</text><text x="870" y="532" class="t">Gyro SPI DMA</text>
    <text x="830" y="564" class="c mono" font-weight="700">2</text><text x="870" y="564" class="t">DShot DMA complete</text>
    <text x="830" y="596" class="c mono" font-weight="700">3</text><text x="870" y="596" class="t">SD card DMA</text>
    <text x="830" y="628" class="c mono" font-weight="700">4–7</text><text x="870" y="628" class="t">GPS · OSD · ADC / RGB · peripheral timer</text>
    <text x="830" y="660" class="c mono" font-weight="700">8</text><text x="870" y="660" class="t">USB (longest, tolerates waiting)</text>
    <text x="830" y="692" class="s" font-size="13">Rule: short and time-critical on top, long and wait-tolerant at the bottom.</text>
  </g>

  <!-- health -->
  <rect x="60" y="744" width="1480" height="80" rx="14" fill="#0b2a2a" stroke="#34d399" stroke-width="2"/>
  <text x="90" y="776" class="g" font-size="16" font-weight="700">Built-in health line (terminal 'x')</text>
  <text x="90" y="804" class="s mono" font-size="14">LOOP max us | overrun/s | CRSF rate · ok · CRC err | slow: &lt;worst section&gt; | UART ovr | motor guard trip / skip (only if non-zero)</text>
</svg>
